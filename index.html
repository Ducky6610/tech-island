<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>數位科技大冒險 · Q版闖關動態島</title>
  <meta name="description" content="數位科技概論 Q 版 3D 闖關動態島：15 座冒險島嶼、4 大王國、經驗值升級、徽章收集與 BOSS 隨堂挑戰！" />
  <link rel="stylesheet" href="style.css" />
  <script src="mqtt.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="scene"></div>
  <div id="labels"></div>
  <div id="fx-layer"></div>

  <header id="topbar">
    <div class="brand">
      <div class="logo" id="btn-mascot-Wave" title="點我呼叫 Bit 博士！">🏝️</div>
      <div>
        <h1>數位科技大冒險 <span>Q版闖關島</span></h1>
        <p>15 座知識冒險島 · 收集 ⭐ 星星、💰 金幣與 🏅 徽章！</p>
      </div>
    </div>

    <!-- 學生勇者闖關狀態列 -->
    <div id="player-hud" title="點擊查看勇者徽章冊！">
      <div class="avatar-ring" id="hud-avatar">🐣</div>
      <div class="hud-info">
        <div class="hud-top">
          <span class="hud-level" id="hud-level">Lv.1</span>
          <span class="hud-title" id="hud-title">初心者學徒</span>
        </div>
        <div class="xp-bar">
          <div class="xp-fill" id="hud-xp-fill" style="width: 10%"></div>
          <span class="xp-text" id="hud-xp-text">0 / 100 XP</span>
        </div>
      </div>
      <div class="hud-stats">
        <div class="stat-pill star-pill" title="關卡星星數（每關最多 3 顆星）">⭐ <b id="hud-stars">0</b><small>/45</small></div>
        <div class="stat-pill coin-pill" title="冒險金幣">💰 <b id="hud-coins">0</b></div>
        <div class="stat-pill streak-pill" title="最高連勝紀錄">🔥 <b id="hud-streak">0</b></div>
      </div>
    </div>

    <!-- 手機端展開/收合選單按鈕 -->
    <button id="btn-mobile-toggle" class="candy-btn pink mobile-menu-toggle" aria-label="切換選單">
      <span class="m-icon">☰</span><span>選單</span>
    </button>

    <div class="topbar-collapsible" id="topbar-collapsible">
      <div class="search">
        <input id="search" type="search" autocomplete="off" placeholder="🔍 搜尋寶藏知識（如：CPU、OSI、IP）…" />
        <div id="search-results" class="hidden"></div>
      </div>

      <nav class="tools">
        <button id="btn-overview" class="candy-btn blue" title="全景視角（H）">🧭<span>全景</span></button>
        <button id="btn-peers" class="candy-btn orange on" title="島上即時學伴動態（P）">👥<span>學伴</span> <b id="online-count">5</b></button>
        <button id="btn-list" class="candy-btn purple" title="冒險地圖清單（L）">🗺️<span>地圖冊</span></button>
        <button id="btn-badges" class="candy-btn yellow" title="成就徽章館與跨裝置進度存檔（B）">🏆<span>徽章·存檔</span></button>
        <button id="btn-quiz" class="candy-btn pink pulse-btn" title="隨機魔王挑戰賽（Q）">⚔️<span>魔王戰</span></button>
        <button id="btn-tour" class="candy-btn green" title="自動巡島導覽（T）">🚂<span>巡島號</span></button>
        <button id="btn-links" class="candy-btn teal on" title="顯示／隱藏彩虹協作橋">🌈<span>彩虹橋</span></button>
        <button id="btn-sound" class="candy-btn orange on" title="切換闖關音效">🔊</button>
      </nav>
    </div>
  </header>

  <aside id="legend">
    <div class="legend-header">🏰 四大主題王國</div>
    <div id="unit-list"></div>
    <div id="quest-box"></div>
    <div id="progress"></div>
  </aside>

  <!-- 島上其他使用者即時動態看板（手機端支援迷你膠囊自動收合） -->
  <div id="live-ticker" class="collapsed" aria-live="polite">
    <div class="ticker-head" id="ticker-head" title="點擊展開／收起學伴動態">
      <span class="live-dot"></span>
      <span class="ticker-title-text">📡 學伴動態 <b id="ticker-mini-count">(5人)</b></span>
      <span id="ticker-toast" class="ticker-toast hidden"></span>
      <button id="btn-ticker-toggle" class="candy-btn-mini" title="展開或收起">▾</button>
      <button id="btn-edit-name" title="修改我的暱稱">✏️ 改名</button>
    </div>
    <div id="ticker-body">
      <div id="ticker-feed"></div>
      <div id="peer-avatars-bar"></div>
    </div>
  </div>

  <!-- 夢幻時間軸（手機端支援迷你時鐘膠囊收合） -->
  <div id="timebar" class="collapsed">
    <div class="clock" id="timebar-toggle" title="點擊展開／收起時間控制器">
      <span id="clock-icon">☀️</span>
      <b id="clock-time">12:00</b>
      <small id="clock-label">晴朗白天</small>
      <span class="timebar-arrow">▾</span>
    </div>
    <div class="timebar-body">
      <div class="presets">
        <button data-t="6">🌅 蜜桃晨光</button>
        <button data-t="12">☀️ 蘇打白天</button>
        <button data-t="17.6">🌇 橘子黃昏</button>
        <button data-t="21">🌙 螢光星夜</button>
      </div>
      <input type="range" id="time-slider" min="0" max="24" step="0.05" value="12" aria-label="時間" />
      <div class="modes">
        <button id="mode-real" title="依照現在時間變化">🕒 即時</button>
        <button id="mode-flow" title="快速流轉一天">⏩ 奇幻流轉</button>
      </div>
    </div>
  </div>

  <aside id="panel" class="hidden" aria-live="polite"></aside>
  <div id="list-view" class="hidden"></div>
  <div id="tour-card" class="hidden"></div>
  <div id="mascot-bubble" class="hidden"></div>
  <div id="modal" class="hidden"><div class="modal-box"></div></div>
  <div id="hint">🎮 拖曳旋轉小島 · 滾輪縮放 · 點擊關卡島奪取 ⭐⭐⭐ 滿星皇冠 · 點擊 Bit 博士領取提示！</div>

  <div id="loader">
    <div class="loader-island">🏝️</div>
    <h2>數位科技大冒險</h2>
    <p>正在充氣 Q 版糖果島嶼與彩虹協作橋…</p>
  </div>

  <!-- 章節資料 -->
  <script src="data/ch01.js"></script>
  <script src="data/ch02.js"></script>
  <script src="data/ch03.js"></script>
  <script src="data/ch04.js"></script>
  <script src="data/ch05.js"></script>
  <script src="data/ch06.js"></script>
  <script src="data/ch07.js"></script>
  <script src="data/ch08.js"></script>
  <script src="data/ch09.js"></script>
  <script src="data/ch10.js"></script>
  <script src="data/ch11.js"></script>
  <script src="data/ch12.js"></script>
  <script src="data/ch13.js"></script>
  <script src="data/ch14.js"></script>
  <script src="data/ch15.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
